name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: lint + typecheck + unit tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # `--experimental-strip-types` is built into Node 22.6+
          # and removes the need for a transpile step in the unit tests.
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for accidentally committed secrets
        run: |
          if command -v gitleaks >/dev/null 2>&1; then
            gitleaks detect --source . --no-banner --redact
          else
            # Fall back to a basic regex scan if gitleaks isn't installed
            # in the runner image.
            echo "::warning::gitleaks not installed in runner; using basic regex"
            ! grep -rEn '(sk-[A-Za-z0-9]{20,}|gsk_[A-Za-z0-9]{20,}|AIza[A-Za-z0-9_-]{30,}|ollama-[A-Za-z0-9]{20,})' \
              --include='*.{ts,tsx,js,mjs,html,css,json,md,yml,yaml}' \
              --exclude-dir={node_modules,.output,.wxt,coverage} . || \
              (echo "::error::secret patterns found in source" && exit 1)
          fi
